[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sectestgen"
version = "0.1.0"
description = "Modular security finding validation and evidence platform for FastAPI backends."
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "tree-sitter>=0.25",
    "tree-sitter-java>=0.23",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "bandit>=1.9",
    # No native Windows build; there SemgrepAdapter runs the Docker image.
    "semgrep>=1.70; sys_platform != 'win32'",
]

[project.scripts]
sectestgen = "sectestgen.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
